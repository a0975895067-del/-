<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>森林競技場｜對戰展示 DEMO</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f1e5;color:#30463d;font-family:system-ui,"Microsoft JhengHei",sans-serif}main{max-width:1200px;margin:auto;padding:22px}h1{margin:8px 0;font-size:30px}p{line-height:1.65}.note{font-size:14px;color:#687a6b}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:15px 0}button,select{font:inherit;padding:10px 14px;border:1px solid #bbc9b1;border-radius:14px;background:#fffef5;color:#30463d;cursor:pointer}button.primary{background:#426b50;color:white}button:disabled{opacity:.5}.arena{position:relative;border-radius:24px;overflow:hidden;background:#dce8da}#stage{height:min(57vw,530px);min-height:330px}canvas{display:block;width:100%;height:100%}.hud{position:absolute;top:16px;left:18px;right:18px;display:flex;justify-content:space-between;gap:40px;pointer-events:none}.player{width:35%;max-width:330px;background:#fffff5e6;padding:12px;border-radius:14px}.player b{display:block}.bar{height:9px;background:#dde2d2;border-radius:9px;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:#6b9e76;transition:width .25s}.enemy .bar i{background:#c69168}.hp{font-size:12px}#caption{padding:14px 20px;background:#fffdf3;min-height:64px;font-size:19px;font-weight:600}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#e5ecdded;font-size:20px}#loading[hidden]{display:none}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.card{background:#fffdf4;border:1px solid #d5dccb;border-radius:18px;padding:16px}ol{padding-left:24px;line-height:1.8}#log{max-height:210px;overflow:auto;margin:0;font-size:14px}label{display:flex;gap:8px;align-items:center}#impact{position:absolute;top:45%;left:65%;font-size:36px;font-weight:bold;color:#924c30;text-shadow:0 2px 0 white;pointer-events:none}a{color:#426b50}@media(max-width:650px){main{padding:12px}.bottom{grid-template-columns:1fr}.player{width:44%;font-size:13px}.hud{gap:10px;left:10px;right:10px}.controls select{max-width:100%}h1{font-size:25px}}
</style></head><body><main><div class="note">對戰展示 · 自動演出／不連接學生資料</div><h1>森林競技場 · 看一場怪獸對戰</h1><p>先選一組搭配，再按「開始對戰」。角色會蓄力、出招、格擋及受擊；也可自行選擇雙方角色。</p>
<div class="controls"><label>對戰組合 <select id="match"><option value="0">暴龍 × 岩甲守衛｜火焰與近戰</option><option value="1">水母 × 苔苔石｜水泡與葉旋</option><option value="2">葉刃刀客 × 翼龍｜斬擊與風翼</option><option value="3">鐮龍 × 星星｜爪擊與星光</option></select></label><button id="start" class="primary">開始對戰</button><button id="pause" disabled>暫停</button><button id="next">下一組</button></div>
<div class="controls"><label>我方 <select id="left"></select></label><label>對手 <select id="right"></select></label><label>速度 <select id="speed"><option value="0.65">慢速</option><option value="1" selected>正常</option><option value="1.5">快速</option></select></label><label><input type="checkbox" id="auto">播完自動換下一組</label></div>
<div class="arena"><div id="stage"></div><div class="hud"><div class="player"><b id="leftName"></b><div class="bar"><i id="leftBar"></i></div><span class="hp" id="leftHp"></span></div><div class="player enemy"><b id="rightName"></b><div class="bar"><i id="rightBar"></i></div><span class="hp" id="rightHp"></span></div></div><div id="impact" hidden></div><div id="loading">準備角色中…</div><div id="caption" aria-live="polite">準備展示</div></div>
<div class="bottom"><section class="card"><b>本場示範規則</b><p>這是預先編排的動畫演示，沒有實際出題。首次答對示範傷害 95、修正答對 78；再次答錯不攻擊，由對手反擊。整場最多防守 3 次。</p><div id="defenses">防守剩餘 3／3</div><p class="note">數字只用於展示攻防節奏，不會變更正式測驗成績。遇到體力歸零，角色退場，不呈現血腥效果。</p></section><section class="card"><b>對戰過程</b><ol id="log"></ol></section></div><p><a href="https://seasonal-math-mission.yu-cheng-gao-0906.chatgpt.site/approved-characters">返回 40 隻角色圖鑑</a></p></main><script type="module" src="battle-showcase.js"></script></body></html>
