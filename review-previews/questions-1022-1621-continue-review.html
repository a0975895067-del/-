function card(q,index){const n=notes[q.id]||{},st=n.status||'unchecked',number=DISPLAY_NUMBERS[q.id]??(DISPLAY_START+index);return '<article class="card '+(st==='ok'?'ok':st!=='unchecked'?'problem':'')+'" id="q-'+E(q.id)+'"><div class="meta">'+E(q.id)+'｜'+q.grade+'年級｜'+E(q.unit)+'｜'+({easy:'易',medium:'中',hard:'難'}[q.level])+' <span class="difficulty">'+E(q.difficultyDesign.name)+'・'+E(q.difficultyDesign.steps)+'</span></div><h2>'+number+'. '+M(q.question)+'</h2>'+(q.figureSvg?'<div class="figures">'+q.figureSvg+'</div>':'')+'<div class="options">'+q.options.map((o,i)=>'<div class="option">'+String.fromCharCode(65+i)+'. '+M(o)+'</div>').join('')+'</div><details class="answer"><summary>查看答案、提示與解析</summary><p>答案：'+String.fromCharCode(65+q.answerIndex)+'｜'+M(q.options[q.answerIndex])+'</p><p>提示：'+M(q.hint)+'</p><p>解析：'+M(q.explanation)+'</p></details><div class="review"><select class="status" data-id="'+E(q.id)+'"><option value="unchecked" '+(st==='unchecked'?'selected':'')+'>尚未檢查</option><option value="ok" '+(st==='ok'?'selected':'')+'>沒有問題</option><option value="stem" '+(st==='stem'?'selected':'')+'>題目需修正</option><option value="options" '+(st==='options'?'selected':'')+'>選項需修正</option><option value="figure" '+(st==='figure'?'selected':'')+'>圖片需修正</option><option value="math" '+(st==='math'?'selected':'')+'>數學內容需修正</option></select><textarea class="note" data-id="'+E(q.id)+'" placeholder="請寫下要修改的文字、數字、選項、線段、角度或圖片位置">'+E(n.note||'')+'</textarea></div><div class="saved">檢查結果會自動保存在這台電腦的瀏覽器中。</div></article>'}
function append(){if(shown>=filtered.length){SENT.textContent=filtered.length?'已顯示本次篩選的全部題目':'沒有符合條件的題目';return}const end=Math.min(shown+BATCH,filtered.length),html=filtered.slice(shown,end).map((q,i)=>card(q,shown+i)).join('');LIST.insertAdjacentHTML('beforeend',html);shown=end;SENT.textContent=shown<filtered.length?'已顯示 '+shown+' 題，繼續向下滑動載入':'已顯示本次篩選的全部 '+shown+' 題';bind();}
function bind(){document.querySelectorAll('.status:not([data-bound]),.note:not([data-bound])').forEach(el=>{el.dataset.bound='1';el.addEventListener(el.classList.contains('note')?'input':'change',save)})}
function save(e){const id=e.target.dataset.id;notes[id]=notes[id]||{};if(e.target.classList.contains('status'))notes[id].status=e.target.value;else notes[id].note=e.target.value;localStorage.setItem(KEY,JSON.stringify(notes));updateProgress();const article=e.target.closest('.card');if(article){const st=notes[id].status||'unchecked';article.classList.toggle('ok',st==='ok');article.classList.toggle('problem',st!=='ok'&&st!=='unchecked')}}
function exportNotes(){const names={unchecked:'尚未檢查',ok:'沒有問題',stem:'題目需修正',options:'選項需修正',figure:'圖片需修正',math:'數學內容需修正'};const rows=BANK.map(q=>({q,n:notes[q.id]||{}})).filter(({n})=>(n.status&&n.status!=='unchecked')||String(n.note||'').trim()).map(({q,n})=>({題號:q.id,題目:q.question,選項:q.options,檢查狀態:names[n.status||'unchecked'],校正文字:String(n.note||'').trim()}));const data={用途:'僅供依照校正文字修正題目，不是最終題庫JSON',匯出時間:new Date().toISOString(),校正項目:rows};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download="第1022至1621題_校正文字.json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
new IntersectionObserver(es=>{if(es[0].isIntersecting)append()},{rootMargin:'700px'}).observe(SENT);[U,L,R].forEach(x=>x.onchange=apply);G.onchange=()=>{units();apply()};S.oninput=apply;$('#exportNotes').onclick=exportNotes;$('#top').onclick=()=>scrollTo({top:0,behavior:'smooth'});units();apply();setTimeout(()=>{if(location.hash)document.querySelector(location.hash)?.scrollIntoView()},120);
</script></body></html>
